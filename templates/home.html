<!DOCTYPE html>
<html>
<head>
<title>VivaStruct</title>
<style>
body {
    margin:0;
    font-family: 'Segoe UI';
    background: linear-gradient(135deg, #667eea, #764ba2);
    color:white;
}
.container {
    text-align:center;
    margin-top:100px;
}
.card {
    background: rgba(255,255,255,0.1);
    padding:40px;
    border-radius:15px;
    width:300px;
    margin:auto;
    backdrop-filter: blur(10px);
}
button {
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    background:#ffffff;
    color:#333;
    font-weight:bold;
    cursor:pointer;
}
button:hover {
    background:#ddd;
}
</style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>VivaStruct</h1>
        <p>AI Powered Viva Evaluation</p>

        <a href="/examiner"><button>Examiner Panel</button></a>
        <a href="/student"><button>Student Panel</button></a>
        <a href="/records"><button>View Records</button></a>
    </div>
</div>

</body>
</html>
